name: CI

on:
  push:
    # Both names, so CI does not silently never run because the default branch
    # is called something other than what this file guessed.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Linux is the only platform this milestone claims. macOS and Windows are
  # deliberately absent rather than present and skipped; see the README.
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --bin loci

      - name: Smoke test the shipped binary
        env:
          LOCI_DATA_DIR: ${{ runner.temp }}/loci-ci
        run: |
          set -euo pipefail
          ./target/release/loci index fixtures/sample --name ci
          ./target/release/loci status ci
          ./target/release/loci query --project ci --label Route --pattern .

      # `install` edits a real user config, so prove it merges rather than
      # clobbers before we ever tell a user to run it.
      - name: Verify install merges into an existing Cursor config
        run: |
          set -euo pipefail
          FAKE_HOME="$(mktemp -d)"
          mkdir -p "$FAKE_HOME/.cursor"
          echo '{"mcpServers":{"someone-else":{"command":"other","args":[]}}}' > "$FAKE_HOME/.cursor/mcp.json"
          HOME="$FAKE_HOME" ./target/release/loci install
          test -x "$FAKE_HOME/.local/bin/loci" \
            || { echo "install did not leave a runnable binary on PATH" >&2; exit 1; }
          python3 - "$FAKE_HOME/.cursor/mcp.json" "$FAKE_HOME" <<'PY'
          import json, sys
          config, home = sys.argv[1], sys.argv[2]
          servers = json.load(open(config))["mcpServers"]
          assert "someone-else" in servers, "install clobbered an unrelated server"
          assert servers["loci"]["args"] == ["mcp"], servers["loci"]
          expected = f"{home}/.local/bin/loci"
          assert servers["loci"]["command"] == expected, (
              f"config must point at the installed copy, not the build output: {servers['loci']}"
          )
          print("install merged cleanly:", sorted(servers))
          PY

      # Exercises all 15 tools against the real binary over the same stdio
      # framing Cursor uses, so a broken tool cannot pass on unit tests alone.
      - name: Exercise every MCP tool over stdio
        env:
          LOCI_DATA_DIR: ${{ runner.temp }}/loci-mcp-ci
        run: python3 scripts/mcp_smoke.py ./target/release/loci "$PWD/fixtures/sample" ci-smoke

      - name: Assert PHP stayed out of scope
        run: |
          set -euo pipefail
          if grep -ril --include='*.rs' --include='*.toml' 'tree-sitter-php\|php-language-server' crates/ benches/; then
            echo "PHP support was added; it is out of scope by design." >&2
            exit 1
          fi
          if find fixtures -name '*.php' | grep -q .; then
            echo "A PHP fixture appeared; remove it." >&2
            exit 1
          fi
          echo "No PHP found."

      - name: Benchmark (recorded, not gated)
        run: cargo run --release -p loci-bench
