[workspace]
resolver = "2"
members = [
    "crates/loci-core",
    "crates/loci-graph",
    "crates/loci-parse",
    "crates/loci-index",
    "crates/loci-lsp",
    "crates/loci-mcp",
    "crates/loci-cli",
    "benches",
]
# Fixture services are parsed, never built.
exclude = ["fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/bodsink/loci"
description = "Local-first code intelligence for AI coding agents"

[workspace.dependencies]
loci-core = { path = "crates/loci-core" }
loci-graph = { path = "crates/loci-graph" }
loci-parse = { path = "crates/loci-parse" }
loci-index = { path = "crates/loci-index" }
loci-lsp = { path = "crates/loci-lsp" }
loci-mcp = { path = "crates/loci-mcp" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
redb = "4.2"
blake3 = "1.8"
ignore = "0.4"
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
tree-sitter = "0.26"
regex = "1.11"
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
