[package]
name = "loci-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tree-sitter extraction of symbols, calls, imports and HTTP routes for loci"

[dependencies]
loci-core = { workspace = true }
loci-graph = { workspace = true }
serde = { workspace = true }
tree-sitter = { workspace = true }
streaming-iterator = "0.1"

tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-perl = "1.1"
# tree-sitter-kotlin 0.3 is pinned to tree-sitter 0.20 and cannot link here.
tree-sitter-kotlin-ng = "1.1"
tree-sitter-bash = "0.25.1"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-ini = "1.4.0"
tree-sitter-make = "1.1.1"
tree-sitter-cmake = "0.7.4"
tree-sitter-html = "0.23.2"
tree-sitter-dart = "0.2.0"
